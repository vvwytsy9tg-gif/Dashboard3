<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,viewport-fit=cover"/>
<title>Olde Raleigh Whiskey Society</title>
<meta name="description" content="Olde Raleigh Distillery Whiskey Society member pickup tracker"/>
<meta name="theme-color" content="#14100a"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Whiskey Society"/>
<meta name="format-detection" content="telephone=no,date=no"/>
<link rel="manifest" id="pwa-manifest"/>
<link rel="apple-touch-icon" id="pwa-icon"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-touch-callout:none}
html,body{background:#0f0c07 !important;font-family:Georgia,serif;color:#e8d5b0;min-height:100vh;overscroll-behavior-y:contain}
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);-webkit-user-select:none;user-select:none}
button{font-family:Georgia,serif;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:Georgia,serif;outline:none;box-sizing:border-box;background:#1a1208 !important;border:1px solid #2e1f0a;border-radius:6px;padding:8px 12px;color:#e8d5b0 !important;width:100%;-webkit-text-fill-color:#e8d5b0;font-size:16px;-webkit-user-select:text;user-select:text}
select option{background:#1a1208}
textarea{resize:vertical}
input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus{
  -webkit-box-shadow:0 0 0 30px #1a1208 inset !important;
  -webkit-text-fill-color:#e8d5b0 !important;
  caret-color:#e8d5b0;
}
input[type=date]{color-scheme:dark;background:#1a1208 !important;color:#e8d5b0 !important}
select{background:#1a1208 !important;color:#e8d5b0 !important}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:#0f0c07}
::-webkit-scrollbar-thumb{background:#3a2a10;border-radius:3px}

/* Overlay & Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.88);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;backdrop-filter:blur(3px)}
.modal{background:#1a1208;border:1px solid #3a2a10;border-radius:16px;padding:28px 26px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,0.7)}

/* Tabs */
.tab{padding:13px 16px;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;border-radius:6px;cursor:pointer;border:1px solid transparent;color:#4a3820;background:transparent;margin:0 4px 4px 0;transition:all 0.15s}
.tab:hover{color:#9a7840;border-color:#2e1f0a}
.tab.active{border-color:rgba(200,169,110,0.4);color:#c8a96e;background:rgba(200,169,110,0.1)}

/* Cards & Rows */
.row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(255,255,255,0.02);border:1px solid #1a1208;border-radius:8px;margin-bottom:5px;font-size:14px}
.stat{background:rgba(200,169,110,0.05);border:1px solid #1a1208;border-radius:10px;padding:14px 12px;text-align:center}
.stat .val{font-size:30px;font-weight:bold;margin-bottom:3px;letter-spacing:-0.5px}
.stat .lbl{font-size:11px;color:#4a3820;letter-spacing:1.5px;text-transform:uppercase}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;margin-bottom:20px}
.section-title{font-size:11px;letter-spacing:2.5px;color:#6a5030;text-transform:uppercase;margin-bottom:12px}
.badge{font-size:11px;padding:2px 7px;border-radius:3px;display:inline-block;margin-left:5px;letter-spacing:0.5px}
.card{background:rgba(200,169,110,0.04);border:1px solid #1a1208;border-radius:12px;padding:18px 20px;margin-bottom:16px}
.gold{color:#c8a96e} .green{color:#7ec8a9} .red{color:#e05c5c} .dim{color:#4a3820}

/* Buttons */
.btn-gold{background:linear-gradient(135deg,#c8a96e,#b8945a);color:#0f0c07;border-radius:8px;padding:11px 22px;font-size:14px;font-weight:bold;cursor:pointer;border:none;font-family:Georgia,serif;letter-spacing:0.5px;box-shadow:0 2px 8px rgba(200,169,110,0.2)}
.btn-outline{background:transparent;color:#c8a96e;border:1px solid rgba(200,169,110,0.35);border-radius:8px;padding:10px 18px;font-size:13px;cursor:pointer;font-family:Georgia,serif}
.btn-red{background:transparent;color:#e05c5c;border:1px solid rgba(224,92,92,0.3);border-radius:8px;padding:10px 14px;font-size:13px;cursor:pointer;font-family:Georgia,serif}
.btn-sm{padding:11px 14px;font-size:12px;border-radius:5px;cursor:pointer;font-family:Georgia,serif}
.pickup-btn{width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-radius:8px;cursor:pointer;margin-bottom:6px;font-family:Georgia,serif;font-size:15px}
.success-msg{background:rgba(126,200,169,0.1);border:1px solid rgba(126,200,169,0.25);border-radius:10px;padding:13px 20px;text-align:center;color:#7ec8a9;font-size:14px;margin-bottom:16px}

/* Admin grouped sections */
.admin-group{background:rgba(200,169,110,0.025);border:1px solid #1a1208;border-radius:14px;padding:20px 22px;margin-bottom:18px}
.admin-group-title{font-size:11px;letter-spacing:2.5px;color:#6a5030;text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.admin-group-title::after{content:"";flex:1;height:1px;background:#1a1208}

/* Ledger */
.ledger-row{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:12px;padding:12px 14px;border-radius:8px;margin-bottom:4px;border:1px solid transparent}
.ledger-row.picked{background:rgba(126,200,169,0.06);border-color:rgba(126,200,169,0.1)}
.ledger-row.pending{background:rgba(255,255,255,0.015);border-color:#141008}
.ledger-pill{font-size:12px;padding:4px 11px;border-radius:20px;font-weight:bold;letter-spacing:0.5px;white-space:nowrap}
.ledger-pill.done{background:rgba(126,200,169,0.12);color:#7ec8a9;border:1px solid rgba(126,200,169,0.2)}
.ledger-pill.todo{background:rgba(200,169,110,0.07);color:#8a6830;border:1px solid rgba(200,169,110,0.12)}

/* Member pickup buttons */
.member-btn{width:100%;display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-radius:12px;cursor:pointer;margin-bottom:8px;font-family:Georgia,serif;font-size:17px;font-weight:bold;border:1px solid;text-align:left;transition:opacity 0.1s}
.member-btn:active{opacity:0.8}
.member-btn.mb-done{background:rgba(126,200,169,0.08);border-color:rgba(126,200,169,0.2);color:#7ec8a9}
.member-btn.mb-todo{background:rgba(200,169,110,0.05);border-color:#1e1408;color:#f0e0b0}
.member-status-chip{font-size:11px;padding:5px 13px;border-radius:20px;letter-spacing:0.5px;white-space:nowrap;font-weight:normal}
.member-status-chip.done{background:rgba(126,200,169,0.12);color:#7ec8a9;border:1px solid rgba(126,200,169,0.2)}
.member-status-chip.todo{background:rgba(200,169,110,0.08);color:#c8a96e;border:1px solid rgba(200,169,110,0.15)}

/* Bottle label */
.bottle-label{background:linear-gradient(160deg,#201608 0%,#170f09 50%,#201608 100%);border:1px solid rgba(200,169,110,0.3);border-radius:16px;padding:28px 28px 22px;margin-bottom:20px;text-align:center;position:relative;overflow:hidden}
.bottle-label::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(200,169,110,0.06) 0%,transparent 65%);pointer-events:none}
.bottle-label-rule{width:36px;height:1px;background:rgba(200,169,110,0.25);margin:10px auto}

/* Alpha bar */
.alpha-bar{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:14px;justify-content:center}
.alpha-key{padding:10px 6px;font-size:13px;border-radius:5px;min-width:40px;min-height:42px;text-align:center;font-family:Georgia,serif;border:1px solid}
.alpha-key.has-letter{background:rgba(200,169,110,0.07);border-color:#1e1408;color:#c8a96e;cursor:pointer}
.alpha-key.no-letter{background:transparent;border-color:transparent;color:#1e1408;cursor:default}

@media(max-width:500px){.grid4{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app" style="background:#0f0c07;min-height:100vh;"></div>
<script>
// Constants
var LOCK_MS=300000, LOW=15, MAX_EX=6, CONFIRM_HISTORY_MONTHS=6;
var MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function getCUR(){var n=new Date();return MONTHS[n.getMonth()]+"-"+n.getFullYear();}
var CUR=getCUR();
var G={gold:"#c8a96e",green:"#7ec8a9",red:"#e05c5c"};

// Default members
// Member list is empty by default — add members via Admin > Members.
var NAMES=[];

function lastName(name){var p=name.trim().split(" ");return p.length>1?p[p.length-1]:p[0];}
function defMembers(){
  return NAMES.map(function(n,i){
    return{id:i+1,name:n,status:"active",oos:false,pickups:{},extras:{},since:"",notes:""};
  });
}

function defConfig(){
  var yr=new Date().getFullYear();
  var cfg={};
  cfg["Jan-"+yr]={blend:"Toasted Madeira",bottles:28,extrasOpen:false,notes:""};
  cfg["Feb-"+yr]={blend:"Orange Wine",bottles:18,extrasOpen:false,notes:""};
  cfg["Mar-"+yr]={blend:"Palo Cortado",bottles:46,extrasOpen:false,notes:""};
  cfg["Apr-"+yr]={blend:"Ruby Port",bottles:58,extrasOpen:false,notes:""};
  cfg["May-"+yr]={blend:"Cognac",bottles:96,extrasOpen:false,notes:""};
  return cfg;
}

// Storage
function ls(k,fb){
  try{var v=localStorage.getItem(k);return v?JSON.parse(v):fb;}
  catch(e){return fb;}
}
function ss(k,v){
  try{localStorage.setItem(k,JSON.stringify(v));}
  catch(e){}
}

// App State
var A={
  mode:"pickup",
  adminOn:false,
  showReset:false,
  confirm:null,
  profile:null,
  flash:"",
  view:"dashboard",
  mSearch:"",
  adminSearch:"",
  mFilter:"all",
  hSearch:"",
  hMonth:"all",
  showAdd:false,
  showBulk:false,
  bulk:"",
  newName:"",
  newOOS:false,
  newSince:"",
  editMo:null,
  showDC:false,
  dcForm:{date:"",bottles:"",notes:"",quarter:"Q2",month:CUR},
  showBackupWarn:false,
  adminConfirm:null,
  backfillMo:null,
  backfillSearch:"",
  dcExpandedMember:null,
  _newMoMonth:null,
  _newMoYear:null,
  members:ls("or2_members",null)||defMembers(),
  config:ls("or2_config",null)||defConfig(),
  dcruns:ls("or2_dcruns",[])||[]
};

var lockTimer=null;
var flashTimer=null;

// Save helpers
function saveAll(){
  ss("or2_members",A.members);
  ss("or2_config",A.config);
  ss("or2_dcruns",A.dcruns);
}

// Computed
function getCfg(){return A.config[CUR]||{blend:"",bottles:0,extrasOpen:false,notes:""};}
function getActive(){return A.members.filter(function(m){return m.status==="active";});}
function getLocal(){return getActive().filter(function(m){return !m.oos;});}
// Active out-of-state members only - mirrors getLocal(). A paused member should
// not appear on a shipment checklist or be counted as someone to ship to.
// (The Members tab's own "oos" filter is separate and still shows paused ones.)
function getOOS(){return getActive().filter(function(m){return m.oos;});}
function getPickedUp(){return A.members.filter(function(m){return m.pickups[CUR]===true;}).length;}
function getExtraSold(){return A.members.reduce(function(a,m){return a+(m.extras[CUR]||0);},0);}
function getDCBottles(mo){
  var m=mo||CUR;
  return A.dcruns.filter(function(r){return r.month===m;}).reduce(function(a,r){return a+r.bottles;},0);
}
function getRemaining(){return Math.max(0,getCfg().bottles-getPickedUp()-getExtraSold());}
// Extra-bottle pool: total bottles made minus members guaranteed one this
// release. Shrinks only when an extra is actually sold.
function getExtraPool(){return Math.max(0,getCfg().bottles-getReservedCount());}
function getExtraPoolRemaining(){return getExtraPool()-getExtraSold();}
function isLow(){return getRemaining()<=LOW&&getCfg().bottles>0;}
function confMonths(){
  return Object.keys(A.config).filter(function(mo){
    var mc=A.config[mo];return mc&&(mc.blend||mc.bottles>0);
  }).sort(function(a,b){return moKey2Date(a)-moKey2Date(b);});
}
function moKey2Date(mo){
  var parts=mo.split("-");
  var mIdx=MONTHS.indexOf(parts[0]);
  if(mIdx===-1)return new Date(0);
  var yr=parts[1]?parseInt(parts[1]):new Date().getFullYear();
  return new Date(yr,mIdx,1);
}
function nextMonthKey(mo){
  var d=moKey2Date(mo);
  d.setMonth(d.getMonth()+1);
  return MONTHS[d.getMonth()]+"-"+d.getFullYear();
}
// New-member eligibility: a member's bottle access starts the month AFTER their
// "since" date. Members with no since date are treated as pre-existing (always eligible).
// NOTE: "YYYY-MM-DD" passed to new Date() is parsed as UTC midnight, which lands on the
// PREVIOUS day in any timezone behind UTC (e.g. Eastern). That shifted a member added on
// the 1st of a month into the prior month, making them eligible a month too early.
// Parse the parts explicitly as a local date instead.
function parseLocalDate(s){
  if(!s)return null;
  var m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m)return new Date(parseInt(m[1],10),parseInt(m[2],10)-1,parseInt(m[3],10));
  var d=new Date(s);
  return isNaN(d)?null:d;
}
// Today's date as YYYY-MM-DD in LOCAL time (toISOString would use UTC and can
// roll to tomorrow's date during the evening in western timezones).
function todayLocalISO(){
  var n=new Date();
  return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0");
}
function sinceMonthKey(m){
  if(!m.since)return null;
  var d=parseLocalDate(m.since);
  if(!d)return null;
  return MONTHS[d.getMonth()]+"-"+d.getFullYear();
}
function isEligible(m,mo){
  var sk=sinceMonthKey(m);
  if(!sk)return true;
  return moKey2Date(mo)>moKey2Date(sk);
}
function getEligibleLocal(){return getLocal().filter(function(m){return isEligible(m,CUR);});}
// Every active member owed a bottle this month - local AND out-of-state. OOS
// bottles are set aside until their quarterly shipment, so they must be reserved
// out of the extras pool or the counter could sell a bottle that's already spoken for.
function getEligibleOOS(){return getOOS().filter(function(m){return isEligible(m,CUR);});}
function getReservedCount(){return getEligibleLocal().length+getEligibleOOS().length;}
// "Total Members" count - active members owed a bottle this month. Excludes paused
// members and those added this month (who start counting next month, matching when
// their bottle access begins). Always equals Local + Out-of-State.
function getCountedMembers(){return getActive().filter(function(m){return isEligible(m,CUR);});}
function getNewGroups(){
  var groups={};
  // Covers local AND out-of-state new members - both follow the same rule that
  // bottle access starts the month after they join.
  getActive().forEach(function(m){
    if(isEligible(m,CUR))return;
    var sk=sinceMonthKey(m)||CUR;
    if(!groups[sk])groups[sk]=[];
    groups[sk].push(m);
  });
  return Object.keys(groups).sort(function(a,b){return moKey2Date(a)-moKey2Date(b);}).map(function(k){
    return{month:k,members:groups[k].slice().sort(function(a,b){return lastName(a.name).localeCompare(lastName(b.name));})};
  });
}

// Unique id generator. Date.now() alone collided during bulk import (dozens of
// members created in the same millisecond), which made two members share one id -
// and since lookups use find(id), checking one of them in marked BOTH picked up.
// Always returns a value strictly greater than any id already in use.
var _lastId=0;
function newId(){
  var maxExisting=_lastId;
  A.members.forEach(function(m){var v=Number(m.id);if(v>maxExisting)maxExisting=v;});
  (A.dcruns||[]).forEach(function(r){var v=Number(r.id);if(v>maxExisting)maxExisting=v;});
  var t=Date.now();
  _lastId=(t>maxExisting)?t:maxExisting+1;
  return _lastId;
}
// One-time repair for rosters saved before the fix above, which may already
// contain duplicate ids. Keeps the first holder's id and reassigns the rest.
function repairDuplicateIds(){
  var seen={},changed=false;
  A.members.forEach(function(m){
    var k=String(m.id);
    if(m.id===undefined||m.id===null||seen[k]){m.id=newId();changed=true;}
    else seen[k]=true;
  });
  var seenD={};
  (A.dcruns||[]).forEach(function(r){
    var k=String(r.id);
    if(r.id===undefined||r.id===null||seenD[k]){r.id=newId();changed=true;}
    else seenD[k]=true;
  });
  if(changed)saveAll();
  return changed;
}

// Flash message
function flash(msg){
  A.flash=msg;
  if(flashTimer)clearTimeout(flashTimer);
  flashTimer=setTimeout(function(){A.flash="";render();},3000);
}
var _searchTimer=null;
function renderDebounced(){
  if(_searchTimer)clearTimeout(_searchTimer);
  _searchTimer=setTimeout(function(){render();},120);
}
function resetLock(){
  if(lockTimer)clearTimeout(lockTimer);
  lockTimer=setTimeout(function(){A.adminOn=false;A.mode="pickup";A.view="dashboard";render();},LOCK_MS);
}

// Actions
function doPickup(id){
  var m=A.members.find(function(x){return x.id===id;});
  if(!m)return;
  if(!isEligible(m,CUR)){flash(m.name+"'s membership starts "+nextMonthKey(CUR)+" — no bottle yet.");render();return;}
  A.members=A.members.map(function(x){
    if(x.id!==id)return x;
    var p=Object.assign({},x.pickups);p[CUR]=true;
    return Object.assign({},x,{pickups:p});
  });
  saveAll();A.confirm=null;A.mSearch="";
  flash(m.oos?m.name+"'s "+CUR+" shipment marked as sent.":"Enjoy your bottle, "+m.name+"!");render();
}
function undoExtra(id,mo){
  A.members=A.members.map(function(x){
    if(x.id!==id)return x;
    var e=Object.assign({},x.extras);
    if((e[mo]||0)>0)e[mo]=e[mo]-1;
    if(e[mo]===0)delete e[mo];
    return Object.assign({},x,{extras:e});
  });
  saveAll();flash("Extra bottle removed.");render();
}
function undoPickup(id,mo){
  A.members=A.members.map(function(x){
    if(x.id!==id)return x;
    var p=Object.assign({},x.pickups);delete p[mo];
    return Object.assign({},x,{pickups:p});
  });
  saveAll();flash("Pickup undone.");render();
}
// Toggle a member's pickup status for a specific past month - used by the
// clickable Bottle History rows so missed months can be checked off in one tap.
function toggleMemberMonthPickup(id,mo){
  A.members=A.members.map(function(x){
    if(x.id!==id)return x;
    var p=Object.assign({},x.pickups);
    if(p[mo])delete p[mo];else p[mo]=true;
    return Object.assign({},x,{pickups:p});
  });
  saveAll();render();
}
// Adjust a member's extras count for a specific month by +1/-1, capped at
// [0, MAX_EX]. Used for direct admin edits (e.g. the DC Runs checklist)
// where the live-purchase safety checks in doExtra() don't apply.
function adjustMemberMonthExtra(id,mo,delta){
  A.members=A.members.map(function(x){
    if(x.id!==id)return x;
    var e=Object.assign({},x.extras);
    var v=Math.max(0,Math.min(MAX_EX,(e[mo]||0)+delta));
    if(v>0)e[mo]=v;else delete e[mo];
    return Object.assign({},x,{extras:e});
  });
  saveAll();render();
}
function doExtra(id,force){
  var m=A.members.find(function(x){return x.id===id;});
  if(!m||!m.pickups[CUR])return;
  var bought=m.extras[CUR]||0;
  if(bought>=MAX_EX){flash("Extra bottle limit reached ("+MAX_EX+").");render();return;}
  var avail=getExtraPoolRemaining();
  if(!force&&avail<=0){
    // Warn but allow override
    A.adminConfirm={
      title:"Extra Bottle Pool Empty",
      message:"There are no extra bottles left in this month's pool ("+getExtraPool()+" total). Sell anyway?",
      ok:"Yes, Sell Extra",cancel:"Cancel",danger:true,
      onOk:function(){doExtra(id,true);}
    };
    A.confirm=null;render();return;
  }
  A.members=A.members.map(function(x){
    if(x.id!==id)return x;
    var e=Object.assign({},x.extras);e[CUR]=(e[CUR]||0)+1;
    return Object.assign({},x,{extras:e});
  });
  saveAll();A.confirm=null;flash("Extra bottle added!");render();
}
// toggleExtra removed - extras always available with built-in safety check
function updCfg(mo,fields){
  var nc=Object.assign({},A.config);
  nc[mo]=Object.assign({},nc[mo]||{},fields);
  A.config=nc;saveAll();render();
}
function updCfgSilent(mo,fields){
  var nc=Object.assign({},A.config);
  nc[mo]=Object.assign({},nc[mo]||{},fields);
  A.config=nc;saveAll();
}
function updMSilent(id,fields){A.members=A.members.map(function(m){return m.id===id?Object.assign({},m,fields):m;});saveAll();}
function resetMonth(){
  A.members=A.members.map(function(m){
    var p=Object.assign({},m.pickups);delete p[CUR];
    var e=Object.assign({},m.extras);delete e[CUR];
    return Object.assign({},m,{pickups:p,extras:e});
  });
  var cfg=getCfg();
  var nc=Object.assign({},A.config);
  nc[CUR]=Object.assign({},cfg,{extrasOpen:false});
  A.config=nc;saveAll();A.showReset=false;flash("Month reset!");render();
}
// Remove a month entirely - its config plus any pickup/extra records members have
// for it, so no orphaned data is left behind in history or exports.
function deleteMonth(mo){
  var nc=Object.assign({},A.config);delete nc[mo];A.config=nc;
  A.members=A.members.map(function(m){
    if(!m.pickups[mo]&&!m.extras[mo])return m;
    var p=Object.assign({},m.pickups);delete p[mo];
    var e=Object.assign({},m.extras);delete e[mo];
    return Object.assign({},m,{pickups:p,extras:e});
  });
  A.dcruns=A.dcruns.filter(function(r){return r.month!==mo;});
  if(A.editMo===mo)A.editMo=null;
  if(A.backfillMo===mo)A.backfillMo=null;
  if(A.hMonth===mo)A.hMonth="all";
  saveAll();flash(mo+" removed.");render();
}
// Full wipe - clears members, months and DC runs. Saves empty (not null) so the
// sample month data in defConfig() does not get re-seeded on the next load.
function wipeAll(){
  A.members=[];A.config={};A.dcruns=[];
  A.confirm=null;A.profile=null;A.backfillMo=null;A.dcExpandedMember=null;
  A.mSearch="";A.adminSearch="";A.hSearch="";A.hMonth="all";A.editMo=null;
  saveAll();
  flash("All data erased \u2014 starting fresh.");
  render();
}
function addMember(force){
  if(!A.newName.trim()){flash("Please enter a member name.");render();return;}
  var nm=A.newName.trim();
  // Bulk Import already blocks duplicates; warn here too so the same member
  // can't be added twice by accident (which would inflate the bottle count).
  if(!force&&A.members.some(function(m){return m.name.toLowerCase()===nm.toLowerCase();})){
    A.adminConfirm={
      title:"Member Already Exists",
      message:'"'+nm+'" is already on the list. Add a second member with this name anyway?',
      ok:"Add Anyway",cancel:"Cancel",danger:false,
      onOk:function(){addMember(true);}
    };
    render();return;
  }
  var since=A.newSince||todayLocalISO();
  A.members.push({id:newId(),name:nm,status:"active",oos:A.newOOS,pickups:{},extras:{},since:since,notes:""});
  A.members.sort(function(a,b){return lastName(a.name).localeCompare(lastName(b.name));});
  saveAll();A.newName="";A.newOOS=false;A.newSince="";A.showAdd=false;render();
}

function togStatus(id){A.members=A.members.map(function(m){return m.id===id?Object.assign({},m,{status:m.status==="active"?"paused":"active"}):m;});saveAll();render();}
function togOOS(id){A.members=A.members.map(function(m){return m.id===id?Object.assign({},m,{oos:!m.oos}):m;});saveAll();render();}
function updM(id,fields){A.members=A.members.map(function(m){return m.id===id?Object.assign({},m,fields):m;});saveAll();}
function importBulk(){
  var names=A.bulk.split("\n").map(function(n){return n.trim();}).filter(function(n){return n.length>0;});
  var existingNames=A.members.map(function(m){return m.name.toLowerCase();});
  var added=0;
  var skipped=[];
  names.forEach(function(n){
    if(existingNames.indexOf(n.toLowerCase())>=0){
      skipped.push(n);
    }else{
      A.members.push({id:newId(),name:n,status:"active",oos:false,pickups:{},extras:{},since:"",notes:""});
      existingNames.push(n.toLowerCase()); // prevent in-paste duplicates too
      added++;
    }
  });
  saveAll();A.bulk="";A.showBulk=false;
  A.members.sort(function(a,b){return lastName(a.name).localeCompare(lastName(b.name));});
  var msg=added+" member"+(added===1?"":"s")+" added!";
  if(skipped.length>0)msg+=" Skipped (already exist): "+skipped.join(", ");
  flash(msg);render();
}

  var sub=document.createElement("div");sub.textContent="Tap the link below to save the file.";sub.style.cssText="font-size:13px;color:#6a5030;margin-bottom:22px;font-family:Georgia,serif;";

function buildBackupCSV(){

  var rows=[["BACKUP","2"],["DATE",today],[""],["=MEMBERS="],["ID","Name","Status","OOS","Since","Notes","Pickups","Extras"]];
  A.members.forEach(function(m){rows.push([m.id,m.name,m.status,m.oos?"1":"0",m.since||"",m.notes||"",JSON.stringify(m.pickups),JSON.stringify(m.extras)]);});
  rows.push([""],["=CONFIG="],["Month","Blend","Bottles","ExtrasOpen","Notes"]);
  Object.keys(A.config).forEach(function(mo){var c=A.config[mo];if(c)rows.push([mo,c.blend||"",c.bottles||0,c.extrasOpen?"1":"0",c.notes||""]);});
  rows.push([""],["=DCRUNS="],["ID","Date","Bottles","Quarter","Month","Notes"]);
  A.dcruns.forEach(function(r){rows.push([r.id,r.date,r.bottles,r.quarter,r.month||CUR,r.notes||""]);});

}

function _clipboardFallback(text,today){

  catch(e){flash("Copy failed — use Download instead.");}

}
function restoreFromText(text){
  try{
    // Full-text, quote-aware CSV parse - handles fields (like multi-line member
    // notes) that contain a real newline inside quotes, which a naive
    // split-by-line-first approach would corrupt.
    function parseCSV(str){
      var rows=[],row=[],cur="",inq=false;
      for(var i=0;i<str.length;i++){
        var c=str[i];
        if(inq){
          if(c==='"'){
            if(str[i+1]==='"'){cur+='"';i++;}
            else inq=false;
          }else cur+=c;
        }else{
          if(c==='"')inq=true;
          else if(c===','){row.push(cur);cur="";}
          else if(c==='\r'){/* ignore */}
          else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur="";}
          else cur+=c;
        }
      }
      if(cur.length>0||row.length>0){row.push(cur);rows.push(row);}
      return rows;
    }
    var rows=parseCSV(text)
      .map(function(row){return row.map(function(v){return v.trim();});})
      .filter(function(row){return !(row.length<=1&&!row[0]);});
    var sec=null,rm=[],rc={},rd=[];
    rows.forEach(function(row){
      if(row[0]==="=MEMBERS="){sec="m";return;}
      if(row[0]==="=CONFIG="){sec="c";return;}
      if(row[0]==="=DCRUNS="){sec="d";return;}
      if(row[0]==="=HELD="){sec="h";return;} // older backups may include this section; ignored on restore
      if(!row[1]||row[0]==="ID"||row[0]==="Month"||row[0]==="BACKUP"||row[0]==="DATE")return;
      if(sec==="m")rm.push({id:parseInt(row[0])||Date.now(),name:row[1],status:row[2]||"active",oos:row[3]==="1",since:row[4]||"",notes:row[5]||"",pickups:JSON.parse(row[6]||"{}"),extras:JSON.parse(row[7]||"{}")});
      if(sec==="c")rc[row[0]]={blend:row[1]||"",bottles:parseInt(row[2])||0,extrasOpen:row[3]==="1",notes:row[4]||""};
      if(sec==="d")rd.push({id:parseInt(row[0])||Date.now(),date:row[1],bottles:parseInt(row[2])||0,quarter:row[3],month:row[4]||CUR,notes:row[5]||""});
    });
    if(rm.length>0){
      // An older/partial backup with no =CONFIG= section must NOT fall back to the
      // sample blends in defConfig() - that would inject fake months into real data.
      A.members=rm;A.config=rc;
      if(rd.length)A.dcruns=rd;
      // Backups written before the unique-id fix can contain duplicate ids.
      repairDuplicateIds();
      saveAll();flash("Restored "+rm.length+" members!");
    }else flash("Could not read backup — is this a valid backup CSV?");
  }catch(err){flash("Restore failed: "+err.message);}
  render();
}
function restoreFile(e){
  var file=e.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){restoreFromText(ev.target.result);};
  reader.readAsText(file);e.target.value="";
}

// DOM Builder
function el(tag,props,kids){
  var e=document.createElement(tag);
  if(props){
    Object.keys(props).forEach(function(k){
      if(k==="cls"){e.className=props[k];}
      else if(k==="style"&&typeof props[k]==="object"){Object.assign(e.style,props[k]);}
      else if(k==="html"){e.innerHTML=props[k];}
      else if(k.substr(0,2)==="on"){e[k]=props[k];}
      else{e.setAttribute(k,props[k]);}
    });
  }
  if(kids){
    (Array.isArray(kids)?kids:[kids]).forEach(function(c){
      if(c==null||c===false||c===undefined)return;
      if(typeof c==="string"||typeof c==="number"){e.appendChild(document.createTextNode(String(c)));}
      else{e.appendChild(c);}
    });
  }
  return e;
}

    var dn=document.createElement("input");dn.type="text";dn.placeholder="Optional notes...";dn.value=A.dcForm.notes;dn.oninput=function(ev){A.dcForm.notes=ev.target.value;};dfield("Notes",dn);

    var dbtns=el("div",{style:{display:"flex",gap:"8px"}});
    dbtns.appendChild(btn("btn-gold","Save Run",addDC));dbtns.appendChild(btn("btn-outline","Cancel",function(){A.showDC=false;render();}));df.appendChild(dbtns);wrap.appendChild(df);
  }
  if(A.dcruns.length===0){wrap.appendChild(el("div",{style:{textAlign:"center",color:"#3a2a10",padding:"32px",fontSize:"14px"}},"No DC runs logged yet."));}
  else{
    A.dcruns.forEach(function(r){
      var row=el("div",{cls:"row"});
      var ri=el("div");
      var rt=el("div",{style:{display:"flex",gap:"10px",alignItems:"center",marginBottom:"4px"}});
      rt.appendChild(el("span",{style:{color:G.gold,fontWeight:"bold",fontSize:"14px"}},"DC: "+r.date));
      rt.appendChild(el("span",{style:{fontSize:"10px",color:"#7a6030",border:"1px solid #1a1208",borderRadius:"4px",padding:"2px 7px"}},r.month||r.quarter));

      ri.appendChild(rt);if(r.notes)ri.appendChild(el("div",{style:{fontSize:"12px",color:"#3a2a10"}},r.notes));row.appendChild(ri);
      row.appendChild(btn("btn-red","Delete",function(id){return function(){A.dcruns=A.dcruns.filter(function(x){return x.id!==id;});saveAll();render();};}(r.id)));
      wrap.appendChild(row);
    });
  }
  return wrap;
}

// Admin wrapper
function renderAdmin(){
  if(!A.adminOn)return null;
  var wrap=el("div",{style:{padding:"24px 28px",background:"#0f0c07",minHeight:"100vh"}});
  var tabs=el("div",{style:{display:"flex",flexWrap:"wrap",marginBottom:"22px",paddingBottom:"16px",borderBottom:"1px solid #1a1208"}});
  ["dashboard","members","months","history","dc runs"].forEach(function(v){
    var tb=document.createElement("button");tb.textContent=v;tb.className="tab"+(A.view===v?" active":"");
    tb.onclick=function(vv){return function(){A.view=vv;userActivity();render();};}(v);
    tabs.appendChild(tb);
  });
  wrap.appendChild(tabs);
  if(A.view==="dashboard")wrap.appendChild(renderDash());
  else if(A.view==="members")wrap.appendChild(renderMembers());
  else if(A.view==="months")wrap.appendChild(renderMonths());
  else if(A.view==="history")wrap.appendChild(renderHistory());
  else if(A.view==="dc runs")wrap.appendChild(renderDC());
  return wrap;
}

  doBkp.style.cssText="display:block;width:100%;margin-bottom:10px;background:linear-gradient(135deg,#c8a96e,#b8945a);color:#0f0c07;border-radius:8px;padding:14px;font-size:14px;font-weight:bold;cursor:pointer;border:none;font-family:Georgia,serif;box-shadow:0 2px 8px rgba(200,169,110,0.2);";

  doCopy.style.display="block";doCopy.style.width="100%";doCopy.style.marginBottom="10px";box.appendChild(doCopy);
  var skip=btn("btn-outline","Skip and Lock Anyway",function(){A.showBackupWarn=false;A.adminOn=false;A.mode="pickup";A.view="dashboard";if(lockTimer)clearTimeout(lockTimer);render();});
  skip.style.display="block";skip.style.width="100%";skip.style.marginBottom="8px";box.appendChild(skip);

// Admin confirm modal
function adminConfirmModal(){
  if(!A.adminConfirm)return null;
  var ac=A.adminConfirm;
  var ov=el("div",{cls:"overlay"});
  var box=el("div",{cls:"modal",style:{textAlign:"center",maxWidth:"340px",borderColor:ac.danger?"rgba(224,92,92,0.4)":"rgba(200,169,110,0.3)"}});

  box.appendChild(el("div",{style:{fontSize:"16px",color:"#f0e0b0",fontWeight:"bold",marginBottom:"10px"}},ac.title||"Are you sure?"));

// Main render
function showHomeScreenPrompt(){return null;}
// userActivity() resets the auto-lock timer. Call it on real user actions only,
// NOT from render() — otherwise flash/debounce renders reset the timer every few seconds.
function userActivity(){if(A.adminOn)resetLock();}
// True only while render() is tearing down/rebuilding the DOM. Removing a
// focused input fires its blur handler as a side effect of the rebuild itself
// (not a real user blur) - onblur handlers check this flag and skip, so that
// teardown-triggered blur can't schedule another render and loop forever.
var _rendering=false;
function render(){
  CUR=getCUR();
  // Keep dcForm.month current so DC form always defaults to current month
  if(!A.showDC)A.dcForm.month=CUR;
  // Preserve focus + cursor position across the full DOM rebuild below -
  // otherwise any input using a debounced re-render (search boxes) loses
  // focus and dismisses the on-screen keyboard after every pause in typing.
  var activeEl=document.activeElement;
  var activeId=activeEl&&activeEl.id?activeEl.id:null;
  var selStart=null,selEnd=null;
  if(activeId&&typeof activeEl.selectionStart==="number"){
    selStart=activeEl.selectionStart;selEnd=activeEl.selectionEnd;
  }
  _rendering=true;
  var app=document.getElementById("app");
  while(app.firstChild)app.removeChild(app.firstChild);
  if(A.confirm!==null){var cm=confirmModal();if(cm)app.appendChild(cm);}
  if(A.profile!==null){var prm=profileModal();if(prm)app.appendChild(prm);}
  if(A.showReset){var rm=resetModal();if(rm)app.appendChild(rm);}
  if(A.showBackupWarn){var bwm=backupWarnModal();if(bwm)app.appendChild(bwm);}
  if(A.adminConfirm){var acm=adminConfirmModal();if(acm)app.appendChild(acm);}
  app.appendChild(renderHeader());
  var hsp=showHomeScreenPrompt();if(hsp)app.appendChild(hsp);
  if(A.mode==="pickup")app.appendChild(renderPickup());
  else if(A.mode==="admin"&&A.adminOn){var adm=renderAdmin();if(adm)app.appendChild(adm);}
  _rendering=false;
  if(activeId){
    var newActive=document.getElementById(activeId);
    if(newActive){
      newActive.focus({preventScroll:true});
      if(selStart!=null&&newActive.setSelectionRange){
        try{newActive.setSelectionRange(selStart,selEnd);}catch(e){}
      }
    }
  }
}
// Any tap, scroll, or keystroke while in admin counts as activity - keeps the
// idle timer from firing mid-task (e.g. while typing notes or a long name list).
document.addEventListener("touchstart",function(){if(A.adminOn)resetLock();},{passive:true});
document.addEventListener("input",function(){if(A.adminOn)resetLock();},true);
document.addEventListener("click",function(){if(A.adminOn)resetLock();},true);
// The on-screen keyboard can cover a focused field near the bottom of a
// scrollable modal - nudge it into view once the keyboard finishes animating in.
document.addEventListener("focusin",function(ev){
  var tag=ev.target.tagName;
  if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT"){
    setTimeout(function(){
      if(document.activeElement===ev.target&&ev.target.scrollIntoView){
        ev.target.scrollIntoView({block:"center",behavior:"smooth"});
      }
    },300);
  }
});

    ctx.quadraticCurveTo(size*0.04,size-size*0.04,size*0.04,size-r);

    ctx.quadraticCurveTo(size*0.04,size*0.04,r,size*0.04);

    var cx=size/2,top=size*0.18,bot=size*0.78,gw=size*0.32;

    ctx.lineTo(cx+gw*0.22,bot);ctx.lineTo(cx+gw*0.34,bot);
    ctx.lineTo(cx+gw*0.34,bot+size*0.04);ctx.lineTo(cx-gw*0.34,bot+size*0.04);
    ctx.lineTo(cx-gw*0.34,bot);ctx.lineTo(cx-gw*0.22,bot);
    ctx.lineTo(cx-gw*0.1,size*0.62);ctx.lineTo(cx-gw*0.35,size*0.52);
    ctx.closePath();ctx.fill();
    ctx.fillStyle="#3a2010";ctx.beginPath();
    ctx.moveTo(cx-gw*0.28,size*0.34);ctx.lineTo(cx+gw*0.28,size*0.34);
    ctx.lineTo(cx+gw*0.35,size*0.52);ctx.lineTo(cx+gw*0.1,size*0.62);
    ctx.lineTo(cx+gw*0.22,bot);ctx.lineTo(cx-gw*0.22,bot);
    ctx.lineTo(cx-gw*0.1,size*0.62);ctx.lineTo(cx-gw*0.35,size*0.52);
    ctx.closePath();ctx.fill();
    return c.toDataURL("image/png");
  }
  var icon192=makeIcon(192);var icon512=makeIcon(512);
  document.getElementById("pwa-icon").href=icon192;
  var manifest={name:"Olde Raleigh Whiskey Society",short_name:"Whiskey Society",description:"Member bottle pickup tracker",start_url:"./",display:"standalone",orientation:"any",background_color:"#14100a",theme_color:"#14100a",icons:[{src:icon192,sizes:"192x192",type:"image/png",purpose:"any maskable"},{src:icon512,sizes:"512x512",type:"image/png",purpose:"any maskable"}]};
  var mblob=new Blob([JSON.stringify(manifest)],{type:"application/manifest+json"});
  document.getElementById("pwa-manifest").href=URL.createObjectURL(mblob);
  // Service worker omitted — blob URL SW registration is blocked by browsers

})();
